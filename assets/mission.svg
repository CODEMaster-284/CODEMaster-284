<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="t d">
<title id="t">CODEMaster mission signal</title><desc id="d">Animated signal connecting code, education and impact.</desc>
<defs><linearGradient id="g"><stop stop-color="#b6841d"/><stop offset=".5" stop-color="#f2ce63"/><stop offset="1" stop-color="#55d69e"/></linearGradient><style>.m{font-family:'JetBrains Mono',Consolas,monospace}.flow{stroke-dasharray:5 11;animation:f 8s linear infinite}.p{animation:p 2.4s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-192}}@keyframes p{50%{opacity:.3;transform:scale(.94)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1200" height="160" rx="18" fill="#080d16" stroke="#d9ab39" stroke-opacity=".25"/><path d="M155 80H1045" class="flow" stroke="url(#g)" stroke-width="2"/>
