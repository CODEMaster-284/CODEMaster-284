name: Generate contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark contribution trails
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: CODEMASTER-284
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23b6841d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23e3b83f

      - name: Publish animation assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
