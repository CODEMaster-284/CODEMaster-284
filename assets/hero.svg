<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">CODEMaster animated developer profile banner</title>
  <desc id="desc">A cinematic command centre introducing Awofesobi Peace Kolade, full-stack engineer and founder of EDUVATE CBT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#05070c"/><stop offset=".55" stop-color="#0b111d"/><stop offset="1" stop-color="#100d06"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8a6414"/><stop offset=".45" stop-color="#f5cf63"/><stop offset="1" stop-color="#b38421"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#e8b931" stop-opacity=".22"/><stop offset="1" stop-color="#e8b931" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d8aa38" stroke-opacity=".06"/></pattern>
    <clipPath id="terminal"><rect x="58" y="54" width="1084" height="350" rx="18"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:blink .9s steps(1) infinite}.scan{animation:scan 6s linear infinite}.orbit{transform-origin:1014px 205px;animation:spin 18s linear infinite}.orbit2{transform-origin:1014px 205px;animation:spin 11s linear infinite reverse}.dash{stroke-dasharray:8 12;animation:dash 14s linear infinite}.fade1{animation:fade 8s ease-in-out infinite}.fade2{animation:fade 8s 2s ease-in-out infinite}.fade3{animation:fade 8s 4s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(410px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-280}}@keyframes fade{0%,18%,100%{opacity:.25}8%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <ellipse cx="900" cy="170" rx="330" ry="250" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="28" y="24" width="1144" height="402" rx="22" fill="none" stroke="url(#gold)" stroke-opacity=".5"/>
  <rect x="58" y="54" width="1084" height="350" rx="18" fill="#080d16" fill-opacity=".82" stroke="#d8aa38" stroke-opacity=".22"/>
  <g clip-path="url(#terminal)"><rect class="scan" x="58" y="0" width="1084" height="80" fill="url(#glow)" opacity=".45"/></g>
  <circle cx="87" cy="81" r="5" fill="#ff5f57"/><circle cx="105" cy="81" r="5" fill="#febc2e"/><circle cx="123" cy="81" r="5" fill="#28c840"/>
  <text x="150" y="86" class="mono" font-size="13" fill="#687386">codemaster://profile/main</text>
  <text x="89" y="144" class="mono" font-size="15" fill="#d8aa38">$ whoami</text>
  <text x="89" y="201" class="sans" font-size="54" font-weight="800" letter-spacing="-2" fill="#f4f0e6">CODE<tspan fill="#e2b63d">Master</tspan></text>
  <text x="91" y="237" class="mono" font-size="17" fill="#9aa7ba">Awofesobi Peace Kolade</text>
  <text x="91" y="284" class="mono fade1" font-size="16" fill="#f0cc67">FULL-STACK ENGINEER</text>
  <text x="91" y="312" class="mono fade2" font-size="16" fill="#f0cc67">FOUNDER · EDUVATE CBT</text>
  <text x="91" y="340" class="mono fade3" font-size="16" fill="#f0cc67">ENGINEERING FOR AFRICAN SCALE</text>
  <text x="91" y="378" class="mono" font-size="13" fill="#5fd49a">● SYSTEM ONLINE</text><rect class="cursor" x="250" y="365" width="8" height="16" fill="#e2b63d"/>
  <g opacity=".95">
    <circle cx="1014" cy="205" r="102" fill="none" stroke="#e2b63d" stroke-opacity=".17"/>
    <circle cx="1014" cy="205" r="75" fill="none" stroke="#e2b63d" stroke-opacity=".32" stroke-dasharray="2 9" class="orbit"/>
    <circle cx="1014" cy="205" r="48" fill="#0d1522" stroke="#e2b63d" stroke-opacity=".7"/>
    <path d="M997 205h34M1014 188v34" stroke="#f0cc67" stroke-width="2"/>
    <g class="orbit"><circle cx="1014" cy="103" r="7" fill="#e2b63d"/><circle cx="1116" cy="205" r="4" fill="#5fd49a"/></g>
    <g class="orbit2"><circle cx="1014" cy="130" r="4" fill="#f4f0e6"/><circle cx="939" cy="205" r="5" fill="#e2b63d"/></g>
    <path class="dash" d="M876 340C948 317 1081 326 1131 267" fill="none" stroke="#d8aa38" stroke-opacity=".35"/>
    <text x="952" y="198" class="mono" font-size="11" fill="#8490a1">BUILD</text><text x="1040" y="217" class="mono" font-size="11" fill="#8490a1">SHIP</text>
  </g>
  <text x="910" y="373" class="mono" font-size="12" fill="#8490a1">LAGOS · NIGERIA · 2026</text>
</svg>
